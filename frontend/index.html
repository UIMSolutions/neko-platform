<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neko Platform</title>
  <!--
    UI5 is loaded from this origin ("resources/"), never from a CDN: isolated
    security domains have no internet access and the backend sends a strict
    Content-Security-Policy. Locally `npm start` (ui5 serve) provides resources/,
    on Cloud Foundry the approuter forwards resources/ to the UI5 destination,
    in air-gapped domains `npm run build` creates a self-contained dist/.
  -->
  <script
    id="sap-ui-bootstrap"
    src="resources/sap-ui-core.js"
    data-sap-ui-theme="sap_fiori_3"
    data-sap-ui-resource-roots='{"neko.platform": "./"}'
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-frame-options="deny">
  </script>
</head>
<body class="sapUiBody" id="content">
  <div
    data-sap-ui-component
    data-name="neko.platform"
    data-id="container"
    data-settings='{"id": "platform"}'
    data-height="100%">
  </div>
</body>
</html>
