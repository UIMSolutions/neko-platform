# UI5 Tooling: serves OpenUI5 locally (resources/) — no CDN, which keeps the
# app working in isolated domains — and proxies the API to the backend.
#   npm start          → http://localhost:8090/index.html (backend: platform-open on :8080)
#   npm run build      → dist/ (self-contained, incl. OpenUI5 runtime; set frontendDir to it)
specVersion: "4.0"
metadata:
  name: neko.platform
type: application
resources:
  configuration:
    paths:
      webapp: .
framework:
  name: OpenUI5
  version: "1.120.21"
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.unified
    - name: themelib_sap_fiori_3
builder:
  resources:
    excludes:
      - "/node_modules/**"
      - "/dist/**"
      - "/test/**"
      - "/localService/**"
server:
  settings:
    httpPort: 8090
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      mountPath: /odata
      afterMiddleware: compression
      configuration:
        baseUri: "http://localhost:8080/odata"
    - name: ui5-middleware-simpleproxy
      mountPath: /rest
      afterMiddleware: compression
      configuration:
        baseUri: "http://localhost:8080/rest"
