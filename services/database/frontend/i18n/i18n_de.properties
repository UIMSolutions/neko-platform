helpTenantTitle=Mandanten
helpTenantText=Jeder Mandant hat eigene Tabellen, Benutzer und Backups, nichts davon wird geteilt. Geben Sie bei der Anmeldung Ihren Mandanten an, leer bedeutet den Mandanten default. Die App merkt sich den zuletzt verwendeten Mandanten auf diesem Gerät. Ihr Mandant steht oben neben dem App-Namen.

